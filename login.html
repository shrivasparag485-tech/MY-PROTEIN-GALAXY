<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protein Galaxy - Login</title>
    <link rel="stylesheet" href="css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <video autoplay muted loop playsinline class="bg-video">
        <source src="VDI/login.mp4" type="video/mp4">
    </video>

    <header>
        <a href="index.html" class="logo">🌌 Protein Galaxy</a>
    </header>
    <div class="container" id="container">

        <!-- Sign Up -->
        <div class="form-container sign-up-container">
            <form id="signupForm">
                <h2>Create Account</h2>
                <input type="text" id="signupName" placeholder="Name" required>
                <input type="email" id="signupEmail" placeholder="Email" required>
                <input type="password" id="signupPassword" placeholder="Password" required>
                <button type="submit">Sign Up</button>
            </form>
        </div>

        <!-- Sign In -->
        <div class="form-container sign-in-container">
            <form id="loginForm">
                <h2>Sign In</h2>
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit">Sign In</button>
            </form>
        </div>
        <!-- Overlay -->
        <div class="overlay-container">
            <div class="overlay">

                <div class="overlay-panel overlay-left">
                    <h2>Welcome Back!</h2>
                    <p>Already have an account?</p>
                    <button class="ghost" id="login">Sign In</button>
                </div>

                <div class="overlay-panel overlay-right">
                    <h2>Hello, Friend!</h2>
                    <p>Enter your details to start journey</p>
                    <button class="ghost" id="register">Sign Up</button>
                </div>

            </div>
        </div>

    </div>

    <script src="js/login.js"></script>
</body>

</html>

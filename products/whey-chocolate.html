<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Whey Protein</title>
    <link rel="stylesheet" href="../css/product.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <a href="../menu.html" class="logo">← Back to Store</a>
    </header>

    <div class="product-page">

        <!-- LEFT IMAGE SECTION -->
        <div class="image-section">
            <img src="../images/whey-chocolate.jpg" id="mainImage">
        </div>

        <!-- RIGHT DETAILS SECTION -->
        <div class="details-section">

            <h1>Whey Protein Chocolate - 1kg</h1>

            <div class="rating">
                ⭐⭐⭐⭐☆
                <span>(1,245 ratings)</span>
            </div>

            <div class="price-box">
                <span class="price">₹2,499</span>
                <span class="mrp">₹3,499</span>
                <span class="discount">28% Off</span>
            </div>

            <p class="stock">In Stock ✔</p>

            <div class="description">
                <h3>About this item</h3>
                <ul>
                    <li>24g Protein per scoop</li>
                    <li>Fast absorption formula</li>
                    <li>Supports muscle growth & recovery</li>
                    <li>Low sugar & low fat</li>
                </ul>
            </div>

            <div class="buttons">
                <button onclick="addToCart('Whey Protein Chocolate', 2499)">
                    Add to Cart
                </button>

                <button class="buy" onclick="buyNow('Whey Protein Chocolate', 2499)">
                    Buy Now
                </button>
            </div>

        </div>
    </div>

    <!-- CUSTOMER REVIEWS -->
    <div class="reviews-section">

        <h2>Customer Reviews</h2>

        <select id="rating">
            <option value="">Rating</option>
            <option value="1">⭐</option>
            <option value="2">⭐⭐</option>
            <option value="3">⭐⭐⭐</option>
            <option value="4">⭐⭐⭐⭐</option>
            <option value="5">⭐⭐⭐⭐⭐</option>
        </select>

        <br><br>

        <textarea id="reviewText" placeholder="write your review"></textarea>

        <br><br>

        <button onclick="addReview()">Submit Review</button>

        <div id="reviewList"></div>
        <!--ave-->
        <div class="averageBox">

            <h3>Average Rating</h3>

            <p id="averageRating">0 ⭐</p>

            <p id="totalReviews">0 Reviews</p>

        </div>

    </div>

    <script src="../js/product.js"></script>
</body>

</html>
